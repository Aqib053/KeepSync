name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest
      - name: Benchmark (main)
        run: python -m bench.run --min 17
      - name: Benchmark (fresh batch 1)
        run: python -m bench.fresh --min 4
      - name: Benchmark (fresh batch 2)
        run: python -m bench.fresh --batch 2 --min 3
